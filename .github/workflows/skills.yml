name: Skills release checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/aialchemy-skills/go.mod
          cache-dependency-path: tools/aialchemy-skills/go.sum
      - run: python -m pip install -r tools/skill-release/requirements.txt CairoSVG==2.8.2
      - run: sudo apt-get update && sudo apt-get install -y libcairo2
      - run: python tools/skill-release/release.py validate
      - run: python -m unittest discover -s tools/skill-release/tests -v
      - run: go test ./... && go vet ./...
        working-directory: tools/aialchemy-skills
      - run: test -z "$(gofmt -l .)"
        working-directory: tools/aialchemy-skills
      - run: python tools/skill-release/release.py build --output "$RUNNER_TEMP/skill-packages"
      - uses: actions/upload-artifact@v4
        with:
          name: skill-packages
          path: ${{ runner.temp }}/skill-packages
